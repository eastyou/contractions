[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contractions"
version = "0.1.0"
description = "英语缩略形式：转换查询与练习纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "english", "grammar", "contractions", "worksheet", "printable"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
contractions = "contractions.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/contractions"
Source = "https://github.com/eastyou/contractions"

[tool.setuptools]
packages = ["contractions"]
